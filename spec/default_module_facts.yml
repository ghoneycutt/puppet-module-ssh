# Facts specified here will override the values provided by rspec-puppet-facts.
---
ssh_version: 'OpenSSH_5.0p1'
ssh_version_numeric: '5.0'
# The rspec facter implementation used by voxpupuli-test resolves facts only
# from the fact set given to each example. Puppet itself looks up
# networking.ip and networking.fqdn when building the node, which logs
# "Could not retrieve fact ..." for fact sets lacking them (such as the
# fictional OS used by the OS independent parameter specs). Note this
# replaces the whole networking hash from rspec-puppet-facts, so every key
# Puppet asks for must be listed here.
networking:
  ip: '192.0.2.1'
  hostname: 'foo'
  domain: 'example.com'
  fqdn: 'foo.example.com'
